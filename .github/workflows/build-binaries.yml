name: Build binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: docling-serve-windows-x64
            release_name: docling-serve-windows-x64.exe
            binary: dist/docling-serve.exe
          - os: ubuntu-latest
            artifact: docling-serve-linux-x64
            release_name: docling-serve-linux-x64
            binary: dist/docling-serve
          - os: ubuntu-24.04-arm
            artifact: docling-serve-linux-arm64
            release_name: docling-serve-linux-arm64
            binary: dist/docling-serve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller==6.16.0

      - name: Build bootstrap binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm bootstrap.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }

      - name: Build bootstrap binary (Linux)
        if: runner.os == 'Linux'
        run: python -m PyInstaller --clean --noconfirm bootstrap.spec

      - name: Rename binary for release
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp dist/docling-serve.exe dist/${{ matrix.release_name }}
          else
            cp dist/docling-serve dist/${{ matrix.release_name }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.release_name }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.release_name }}
