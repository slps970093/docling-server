name: Build binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: docling-serve-windows-x64
            binary: dist/docling-serve.exe
            release_name: docling-serve-windows-x64.exe
          - os: ubuntu-latest
            artifact: docling-serve-linux-x64
            binary: dist/docling-serve
            release_name: docling-serve-linux-x64
          - os: ubuntu-24.04-arm
            artifact: docling-serve-linux-arm64
            binary: dist/docling-serve
            release_name: docling-serve-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build.ps1 -Clean
      - name: Build on Linux
        if: runner.os == 'Linux'
        run: bash ./build.sh --clean
      - name: Smoke test
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./dist/docling-serve.exe --help
          else
            ./dist/docling-serve --help
          fi
      - name: Rename binary for release
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp dist/docling-serve.exe dist/${{ matrix.release_name }}
          else
            cp dist/docling-serve dist/${{ matrix.release_name }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.release_name }}
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.release_name }}
